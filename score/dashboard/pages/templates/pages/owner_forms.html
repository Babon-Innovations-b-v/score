{% comment %}The owner's books buttons, each his signed-in request: applied here on the store's machine, queued for it when hosted.{% endcomment %}
{% if owner %}
<form class="cost-form" data-post="/api/money/read-back">
  <button class="primary" title="read this month's bills again">Read the bills</button>
  <output class="small"></output>
</form>
<form class="cost-form" data-post="/api/money/books-figure">
  <label class="wide" title="what the model calls cost this month before their ledger began again">EUR<input type="number" name="euros" min="0" step="0.01" required></label>
  <button class="primary">Enter</button>
  <output class="small"></output>
</form>
{% endif %}
