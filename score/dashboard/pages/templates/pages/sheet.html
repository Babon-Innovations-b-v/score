{% with images=files %}
<div class="sheet">{% for file in images %}{% if file.kind == "image" %}<figure><a href="{{ file.url }}"><img src="{{ file.thumb_url }}" alt="{{ file.name }}" loading="lazy"></a><figcaption>{{ file.name }}</figcaption></figure>{% endif %}{% endfor %}</div>
{% for file in images %}{% if file.kind == "film" %}<video src="{{ file.url }}" controls preload="metadata" style="width:100%;max-width:720px;border-radius:8px;margin-top:8px"></video>{% endif %}{% endfor %}
{% endwith %}
