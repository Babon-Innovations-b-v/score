{% comment %}A progress ring: `done` of `total`, `tip` its hover text.{% endcomment %}<svg class="ring" viewBox="0 0 36 36" role="img" aria-label="{{ done }} of {{ total }}"><title>{{ tip|default:"made / needed" }}</title><circle class="ring-track" cx="18" cy="18" r="15.9155" pathLength="100"/><circle class="ring-fill" cx="18" cy="18" r="15.9155" pathLength="100" stroke-dasharray="{% widthratio done total 100 %} 100"/><text x="18" y="20.5" data-v>{{ done }}/{{ total }}</text></svg>
