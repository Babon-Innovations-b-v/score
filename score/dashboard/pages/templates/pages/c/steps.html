{% comment %}A place's design steps (screens.DESIGN_STEPS: concept locked, inventory read, plan made; all done, the design is approved): `steps` [done] in order as pips, `done` how many, `tip` its hover text.{% endcomment %}<span class="design-steps" title="{{ tip }}">{% for step in steps %}<i class="pip{% if step %} done{% endif %}" aria-hidden="true"></i>{% endfor %}<b data-v>{{ done }}/{{ steps|length }}</b></span>
