<div class="dots" title="green accepted, amber waiting, red stopped, grey not run; a ring: not seen by owner">{% for layer in layers %}{% for step in layer.steps %}<span class="dot {{ step.state|slugify }}{% if step.mark == "not seen by owner" %} unseen{% endif %}" title="{{ step.label }}: {{ step.state_words }}{% if step.mark %} ({{ step.mark }}){% endif %}"></span>{% endfor %}<span class="sep"></span>{% endfor %}</div>
