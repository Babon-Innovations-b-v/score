{% comment %}A picture, or a calm tile in its place: `src` the picture, `name` what it is (the tile's words when there is none), `bare` set: no second line.{% endcomment %}{% if src %}<img class="pic" src="{{ src }}" alt="{{ name }}" loading="lazy" data-name="{{ name }}">{% else %}<div class="pic empty"><span>{{ name }}</span>{% if not bare %}<small>no picture yet</small>{% endif %}</div>{% endif %}
