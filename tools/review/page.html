<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600&display=swap">
<style>
/* A long scroll in stage order with a sticky table of contents; colours from the game's design tokens
   (design/tokens/tokens.json): its "ledger" theme in light, its "ops" theme in dark. */
:root {
  --ground: #e3e7e2; --surface: #f3f5f1; --line: #a9b3aa; --ink: #1c221e; --muted: #525d55;
  --accent: #855a00; --ok: #2c6a22; --bad: #a12c25; --box: #e2571e;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif; --body: "Barlow", "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ground: #1b1712; --surface: #29221b; --line: #5a4e40; --ink: #f3ebda; --muted: #b8aa92;
  --accent: #e9b440; --ok: #86c766; --bad: #f2766a; --box: #f0763f; color-scheme: dark } }
:root[data-theme="dark"] {
  --ground: #1b1712; --surface: #29221b; --line: #5a4e40; --ink: #f3ebda; --muted: #b8aa92;
  --accent: #e9b440; --ok: #86c766; --bad: #f2766a; --box: #f0763f; color-scheme: dark }
* { box-sizing: border-box }
body { margin: 0; background: var(--ground); color: var(--ink); font: 16px/1.5 var(--body); padding-inline: 16px }
main { max-width: 1240px; margin: 0 auto; padding-block: 24px 64px; display: grid; gap: 40px }
header h1 { font: 600 2.6rem/1.1 var(--display); letter-spacing: .01em; margin: 0; text-wrap: balance }
header p { color: var(--muted); margin: .4rem 0 0 }
nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--ground);
  border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 4px 16px; padding-block: 8px }
nav a { color: var(--accent); text-decoration: none; font: 600 .95rem var(--display); letter-spacing: .06em;
  text-transform: uppercase }
nav a:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
section { display: grid; gap: 14px; min-width: 0 }
h2 { font: 600 1.7rem/1.2 var(--display); margin: 0; border-top: 2px solid var(--ink); padding-top: 10px }
h3 { font: 600 1.2rem/1.2 var(--display); margin: 10px 0 0; letter-spacing: .02em }
h3 small { color: var(--muted); font: 400 .9rem var(--body) }
.lead { max-width: 70ch; font-size: 1.05rem }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)) }
.grid.wide { grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)) }
.grid.pairs { grid-template-columns: repeat(auto-fill, minmax(min(100%, 560px), 1fr)) }
figure { margin: 0; display: grid; gap: 4px; align-content: start; min-width: 0 }
figure img, video { width: 100%; max-width: 100%; display: block; background: var(--surface); border: 1px solid var(--line) }
figure.chosen img { border: 3px solid var(--accent) }
figure.text { border: 1px dashed var(--line); padding: 10px }
figcaption { font-size: .88rem; color: var(--muted) }
figcaption b { color: var(--ink) }
.pair .two { display: grid; grid-template-columns: 1fr 1fr; gap: 4px }
.pair .two.three { grid-template-columns: 1fr 1fr 1fr }
.pair .two > div { position: relative; min-width: 0 }
.tag { position: absolute; left: 4px; top: 4px; background: var(--ground); color: var(--ink); font: 600 .75rem var(--display);
  letter-spacing: .08em; text-transform: uppercase; padding: 1px 6px }
.overlay { position: relative }
.overlay svg { position: absolute; inset: 0; width: 100%; height: 100% }
.overlay rect { fill: none; stroke: var(--box); stroke-width: 6 }
.overlay text { fill: var(--box); font: 600 30px var(--display); paint-order: stroke; stroke: #000; stroke-width: 4 }
.facts { display: flex; flex-wrap: wrap; gap: 6px 24px; margin: 0 }
.facts div { min-width: 0 }
.facts dt { font: 600 .75rem var(--display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted) }
.facts dd { margin: 0; overflow-wrap: anywhere }
.model { display: grid; gap: 10px; padding: 14px; background: var(--surface); border: 1px solid var(--line) }
.cells { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)) }
.cell { min-width: 0 }
.scroll { overflow-x: auto }
table { border-collapse: collapse; width: 100%; font-size: .9rem }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top }
th { font: 600 .8rem var(--display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
td.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap }
.pill { font: 600 .75rem var(--display); letter-spacing: .08em; text-transform: uppercase; padding: 1px 8px; border: 1px solid }
.pill.ok { color: var(--ok) } .pill.bad { color: var(--bad) }
.swatch { display: inline-block; width: 14px; height: 14px; border: 1px solid var(--line); margin-right: 6px; vertical-align: -2px }
.missing { color: var(--muted); font-style: italic }
.prompt { max-width: 80ch; font-size: .88rem; color: var(--muted) }
@media (prefers-reduced-motion: reduce) { video { display: none } }
</style>
</head>
<body>
<main>
<header>
<h1>{{PLACE}}: review</h1>
<p>Every stage's output in the order the stages ran, built from the files they wrote.</p>
{{SOURCES}}
</header>
<nav aria-label="stages">
<a href="#concept">Concept</a><a href="#plan">Plan</a><a href="#inventory">Inventory</a><a href="#closeups">Close-ups</a>
<a href="#models">Models</a><a href="#surfaces">Surfaces</a><a href="#scene">Scene</a><a href="#characters">Characters</a><a href="#checks">Checks</a>
</nav>
{{SECTIONS}}
</main>
</body>
</html>
