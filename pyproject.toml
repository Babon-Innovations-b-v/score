[project]
name = "score"
version = "0.1.0"
description = "SCORE: a framework that compiles a creator's picks into a complete, owned, editable world."
license = "MIT"
requires-python = ">=3.11,<3.13"
# The plain-Python side that runs on the coordinating machine: plans, labels, checks, the scene package. Models,
# bakes and renders run on rented cloud machines with their own setup scripts (tools/cloud/*_setup.sh).
dependencies = [
    "numpy>=2.4",
    "scipy>=1.17",
    "trimesh>=5.1",
    "pillow>=12.3",
    "rtree>=1.4",
    "embreex>=4.4",
    "xatlas>=0.0.11",
    "networkx>=3.6",
    "scikit-image>=0.26",
    "fast-simplification>=0.2",
    "matplotlib>=3.11",
    "fonttools>=4.65",
    "requests>=2.34",
    "usd-core>=25.5",
    "python-fcl>=0.7.0.11",
    "boto3>=1.43.110",
    "usd-validation-nvidia[usd]==1.22.0",
    "coacd==1.0.14",
]

[dependency-groups]
dev = ["pytest>=9", "pytest-django>=4.11"]
# The dashboard (score/dashboard): Django pages, a FastAPI /api, uvicorn. Its own group so the hosted container installs
# only these (uv export --only-group dashboard), never numpy or usd-core.
dashboard = ["django>=5.2,<5.3", "fastapi>=0.115", "uvicorn>=0.34", "pydantic>=2.10", "httpx>=0.28"]

[tool.uv]
package = false
